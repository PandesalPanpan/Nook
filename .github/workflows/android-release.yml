name: Publish Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build, such as v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOOK_RELEASE_STORE_PASSWORD: ${{ secrets.NOOK_RELEASE_STORE_PASSWORD }}
      NOOK_RELEASE_KEY_ALIAS: ${{ secrets.NOOK_RELEASE_KEY_ALIAS }}
      NOOK_RELEASE_KEY_PASSWORD: ${{ secrets.NOOK_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install the Android build platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate tag and release notes
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Android releases require a v<major>.<minor>.<patch> tag.' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" ]]; then
            echo 'The checked-out source does not match the release tag.' >&2
            exit 1
          fi
          notes="docs/release-notes/${RELEASE_TAG}.md"
          if [[ ! -s "${notes}" ]]; then
            echo "Missing release notes: ${notes}" >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "notes=${notes}" >> "${GITHUB_OUTPUT}"

      - name: Validate and materialize Firebase configuration
        env:
          NOOK_FIREBASE_CONFIG_BASE64: ${{ secrets.NOOK_FIREBASE_CONFIG_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NOOK_FIREBASE_CONFIG_BASE64:-}" ]]; then
            echo 'Missing required GitHub Actions secret: NOOK_FIREBASE_CONFIG_BASE64' >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64, json, os
          raw = base64.b64decode(os.environ['NOOK_FIREBASE_CONFIG_BASE64'], validate=True)
          config = json.loads(raw)
          required = ('apiKey', 'applicationId', 'projectId', 'storageBucket', 'googleWebClientId')
          if any(not isinstance(config.get(key), str) or not config[key].strip() for key in required):
              raise SystemExit('Firebase configuration is incomplete.')
          if config['projectId'] != 'nook-app-e3f48':
              raise SystemExit('Firebase configuration targets the wrong project.')
          output = 'apps/android/app/src/main/assets/nook-firebase.json'
          os.makedirs(os.path.dirname(output), exist_ok=True)
          with open(output, 'wb') as file:
              file.write(raw)
          os.chmod(output, 0o600)
          PY

      - name: Validate signing secrets and decode keystore
        env:
          NOOK_RELEASE_KEYSTORE_BASE64: ${{ secrets.NOOK_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in NOOK_RELEASE_KEYSTORE_BASE64 NOOK_RELEASE_STORE_PASSWORD NOOK_RELEASE_KEY_ALIAS NOOK_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done
          umask 077
          key_path="${RUNNER_TEMP}/nook-release.p12"
          printf '%s' "${NOOK_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${key_path}"
          test -s "${key_path}"
          chmod 600 "${key_path}"

      - name: Run Android tests, lint, and debug/release builds
        working-directory: apps/android
        env:
          NOOK_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/nook-release.p12
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test lint assembleDebug assembleRelease

      - name: Validate release APK and create update manifest
        id: artifact
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          apk='apps/android/app/build/outputs/apk/release/app-release.apk'
          test -s "${apk}"
          aapt="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          badging="$("${aapt}" dump badging "${apk}")"
          package_name="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<< "${badging}")"
          version_code="$(sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" <<< "${badging}")"
          version_name="$(sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" <<< "${badging}")"
          min_sdk="$(sed -n "s/^sdkVersion:'\\([^']*\\)'.*/\\1/p" <<< "${badging}")"
          if [[ "${package_name}" != 'app.nook' || -z "${version_code}" || -z "${version_name}" || "${version_name}" != "${RELEASE_TAG#v}" || "${min_sdk}" != '26' ]]; then
            echo 'The APK package, tag, version, or minimum SDK does not match Nook release metadata.' >&2
            exit 1
          fi
          if ! "${apksigner}" verify --verbose "${apk}"; then
            echo 'The Android release APK is unsigned or has an invalid signature.' >&2
            exit 1
          fi
          signature="$("${apksigner}" verify --print-certs "${apk}")"
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "${signature}" | tr '[:lower:]' '[:upper:]')"
          expected_cert="$(tr -d ':\r\n' < apps/android/release-certificate.sha256 | tr '[:lower:]' '[:upper:]')"
          if [[ -z "${actual_cert}" || "${actual_cert}" != "${expected_cert}" ]]; then
            echo 'The Android release APK signer does not match the pinned Nook release certificate.' >&2
            exit 1
          fi
          apk_name="nook-v${version_name}.apk"
          staged_apk="${RUNNER_TEMP}/${apk_name}"
          cp "${apk}" "${staged_apk}"
          sha256="$(sha256sum "${staged_apk}" | cut -d ' ' -f1)"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          manifest="${RUNNER_TEMP}/update.json"
          node scripts/create-android-update-manifest.mjs \
            --output "${manifest}" \
            --tag "${RELEASE_TAG}" \
            --sha256 "${sha256}" \
            --published-at "${published_at}"
          python3 - "${manifest}" "${package_name}" "${version_code}" "${version_name}" "${sha256}" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding='utf-8'))
          if manifest['packageName'] != sys.argv[2] or str(manifest['versionCode']) != sys.argv[3] or manifest['versionName'] != sys.argv[4] or manifest['sha256'] != sys.argv[5]:
              raise SystemExit('update.json does not match the built APK.')
          PY
          echo "apk=${staged_apk}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=${apk_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"

      - name: Publish the signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          APK_PATH: ${{ steps.artifact.outputs.apk }}
          APK_NAME: ${{ steps.artifact.outputs.apk_name }}
          MANIFEST_PATH: ${{ steps.artifact.outputs.manifest }}
          VERSION_NAME: ${{ steps.artifact.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "${APK_PATH}#${APK_NAME}" \
            "${MANIFEST_PATH}#update.json" \
            --title "Nook ${VERSION_NAME}" \
            --notes-file "${RELEASE_NOTES}" \
            --verify-tag \
            --latest
          assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '[.assets[].name] | join(",")')"
          if [[ ",${assets}," != *",${APK_NAME},"* || ",${assets}," != *",update.json,"* ]]; then
            echo 'The published GitHub Release is missing a required asset.' >&2
            exit 1
          fi

      - name: Remove temporary Firebase and signing files
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "${RUNNER_TEMP}/nook-release.p12" \
            "${GITHUB_WORKSPACE}/apps/android/app/src/main/assets/nook-firebase.json" \
            "${RUNNER_TEMP}"/nook-v*.apk \
            "${RUNNER_TEMP}/update.json"
